<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Financiero Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>

    <div class="dashboard-container">
        
        <header class="header">
            <h1>Análisis Financiero</h1>
            <p>Monitoreo general de ingresos y gastos</p>
        </header>

        <!-- FILA 1: KPIs (Indicadores clave) -->
        <section class="kpi-grid">
            <div class="card kpi-card">
                <span class="card-title">Balance Disponible</span>
                <h2 id="total-balance">$0.00</h2>
            </div>
            <div class="card kpi-card income">
                <span class="card-title">Total Ingresos</span>
                <h2 id="total-income">+$0.00</h2>
            </div>
            <div class="card kpi-card expense">
                <span class="card-title">Total Gastos</span>
                <h2 id="total-expense">-$0.00</h2>
            </div>
        </section>

        <!-- FILA 2: Gráficos Analíticos -->
        <section class="charts-grid">
            <div class="card chart-card">
                <h3>Categoría de Gastos</h3>
                <div class="chart-wrapper">
                    <canvas id="expenseChart"></canvas> <!-- Gráfico de Rosca -->
                </div>
            </div>
            <div class="card chart-card">
                <h3>Ingresos vs Gastos Mensual</h3>
                <div class="chart-wrapper">
                    <canvas id="barChart"></canvas> <!-- Gráfico de Barras -->
                </div>
            </div>
        </section>

        <!-- FILA 3: Operaciones e Historial -->
        <section class="operations-grid">
            <div class="card form-card">
                <h3>Nueva Transacción</h3>
                <form id="transaction-form">
                    <div class="input-group">
                        <input type="text" id="description" placeholder="Ej: Sueldo, Comida..." required>
                    </div>
                    <div class="input-row">
                        <input type="number" id="amount" step="0.01" placeholder="Monto ($)" required>
                        <select id="type" required>
                            <option value="income">Ingreso (+)</option>
                            <option value="expense" selected>Gasto (-)</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <select id="category" required>
                            <option value="Trabajo">💼 Trabajo</option>
                            <option value="Comida">🍕 Comida</option>
                            <option value="Servicios">💡 Servicios</option>
                            <option value="Transporte">🚗 Transporte</option>
                            <option value="Entretenimiento">🎬 Entretenimiento</option>
                            <option value="Otros">📦 Otros</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-primary">Añadir Registro</button>
                </form>
            </div>

            <div class="card history-card">
                <h3>Últimos Movimientos</h3>
                <ul id="transaction-list" class="transaction-list"></ul>
            </div>
        </section>

    </div>

    <script src="./assets/js/app.js"></script>
</body>
</html>
